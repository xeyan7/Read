<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Fast - ADHD</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/logo-16.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/logo.png" alt="" class="logo-img">
        <div class="brand-text">
          <span class="brand-title">Read Fast</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Switch theme" aria-label="Switch color theme">
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>
          </svg>
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>
          </svg>
        </button>
        <button id="settingsWheel" class="icon-btn" title="Settings" aria-label="Open settings" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
            <circle cx="16" cy="7" r="2"/>
            <circle cx="10" cy="17" r="2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- View 1: Main -->
    <main id="viewMain" class="view-panel">
      <div class="action-wrap">
        <div id="spinner" class="spinner" role="status" aria-label="Loading">
          <div class="spinner-ring"></div>
        </div>
        <button id="toggleButton" class="status-card" style="display: none;" aria-pressed="false">
          <span class="status-top">
            <span class="eyebrow">This tab</span>
            <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
          </span>
          <span class="status-title" id="ctaText">Off</span>
          <span class="status-sub" id="ctaSub">Tap to bold word anchors on this page</span>
        </button>
        <p class="page-note" id="pageNote" style="display: none;" role="status"></p>
      </div>

      <!-- Strength -->
      <section class="card" aria-label="Reading strength">
        <div class="row">
          <span class="eyebrow">Strength</span>
          <span class="value" id="dockVal">Medium</span>
        </div>
        <div class="seg" id="popupIntensityGroup" role="radiogroup" aria-label="Reading intensity">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" class="dock-seg-btn" data-intensity="light" role="radio" aria-checked="false">Light</button>
          <button type="button" class="dock-seg-btn is-active" data-intensity="medium" role="radio" aria-checked="true">Medium</button>
          <button type="button" class="dock-seg-btn" data-intensity="strong" role="radio" aria-checked="false">Strong</button>
        </div>
      </section>

      <!-- Preview -->
      <section class="card" aria-label="Reading preview">
        <div class="row">
          <div class="row-group">
            <span class="eyebrow">Preview</span>
            <span class="chip" id="previewState">Plain</span>
          </div>
          <button id="cycleSampleBtn" class="icon-btn icon-btn-sm" type="button" title="Next sample" aria-label="Show next sample sentence">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/>
              <path d="M4 3v5h5"/>
              <path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/>
              <path d="M20 21v-5h-5"/>
            </svg>
          </button>
        </div>
        <p class="preview-sample" id="previewSample">
          I <span class="wb">re</span>ad <span class="wb">fa</span>st to <span class="wb">fo</span>cus <span class="wb">atten</span>tion<br>and <span class="wb">bo</span>ost <span class="wb">rea</span>ding <span class="wb">compre</span>hension.
        </p>
      </section>

      <footer class="foot">
        <span class="foot-item mono">Esc to close</span>
      </footer>
    </main>

    <!-- View 2: Settings -->
    <section id="viewSettings" class="view-panel" style="display: none;" aria-label="Settings">
      <div class="settings-bar">
        <button id="settingsBackBtn" class="icon-btn" type="button" aria-label="Back">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <span class="settings-title">Settings</span>
        <span class="settings-spacer" aria-hidden="true"></span>
      </div>

      <section class="card" aria-label="Activation">
        <div class="row">
          <span class="eyebrow">Activation</span>
          <span class="value" id="settingsModeVal">Automatic</span>
        </div>
        <div class="seg seg-2" id="popupModeGroup" role="radiogroup" aria-label="Activation behavior">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" class="dock-seg-btn is-active" data-mode="automatic" role="radio" aria-checked="true">Automatic</button>
          <button type="button" class="dock-seg-btn" data-mode="manual" role="radio" aria-checked="false">Manual</button>
        </div>
        <p class="hint">Automatic bolds pages as they load. Manual waits for you.</p>
      </section>

      <section class="card" aria-label="Site rules">
        <div class="row">
          <span class="eyebrow" id="siteRulesTitle">Excluded sites</span>
          <span class="value" id="siteRulesCount"></span>
        </div>
        <div class="rules">
          <div id="siteRulesList" class="rules-list"></div>
          <p id="siteRulesEmpty" class="rules-empty" style="display: none;">No excluded sites.</p>
        </div>
        <form id="addRuleForm" class="rule-form">
          <input type="text" id="newRuleHost" class="input" placeholder="site-to-exclude.com" autocomplete="off" spellcheck="false" required>
          <button type="submit" class="btn-primary" id="addRuleBtn">Exclude</button>
        </form>
        <p class="hint" id="siteRulesHint">Bold everywhere except these sites.</p>
      </section>
    </section>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
