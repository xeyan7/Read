<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Fast - ADHD</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/logo-16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Top Navigation / Brand Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <img src="icons/logo.png" alt="Read Fast - ADHD" class="logo-img">
        </div>
        <div class="brand-text">
          <div class="brand-eyebrow">Visual Flow · v1.2</div>
          <div class="brand-title">Read Fast</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="gear" title="Toggle light / dark mode" aria-label="Toggle theme">
          <svg class="theme-icon-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <button id="settingsWheel" class="gear" title="Extension preferences" aria-label="Open preferences">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Active Tab Domain & Host Status Card -->
    <section class="card site" id="hostCard" aria-label="Current site status">
      <div class="site-main">
        <span class="host-dot" id="statusDot"></span>
        <div class="site-text">
          <span class="site-label">Active Host</span>
          <span class="site-name" id="hostName">Detecting…</span>
        </div>
      </div>
      <div class="site-side">
        <span class="pill" id="hostBadge">Checking</span>
        <button id="resetHost" class="reset" style="display: none;" type="button" title="Reset site to global default">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Reset</span>
        </button>
      </div>
    </section>

    <!-- Primary Action Hero Toggle Island -->
    <div class="action-wrap">
      <div id="spinner" class="spinner" role="status" aria-label="Loading status">
        <div class="spinner-ring"></div>
      </div>
      <button id="toggleButton" class="activate" style="display: none;" aria-pressed="false">
        <span class="power">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </span>
        <span class="activate-text">
          <span class="activate-title" id="ctaText">Activate</span>
          <span class="activate-sub" id="ctaSub">Bionic reading for this tab</span>
        </span>
        <span class="arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
      <p class="page-note" id="pageNote" style="display: none;" role="status"></p>
    </div>

    <!-- Reading Strength Segmented Controller -->
    <section class="card weights" aria-label="Reading strength">
      <div class="row">
        <span class="label">Anchor Strength</span>
        <span class="value" id="dockVal">Medium (700)</span>
      </div>
      <div class="seg" id="popupIntensityGroup" role="radiogroup" aria-label="Reading intensity">
        <button type="button" class="dock-seg-btn" data-intensity="light" role="radio" aria-checked="false">Light</button>
        <button type="button" class="dock-seg-btn is-active" data-intensity="medium" role="radio" aria-checked="true">Medium</button>
        <button type="button" class="dock-seg-btn" data-intensity="strong" role="radio" aria-checked="false">Strong</button>
      </div>
    </section>

    <!-- Real-Time Interactive Sample Preview -->
    <section class="card preview" aria-label="Reading sample preview">
      <div class="row">
        <div class="preview-title-group">
          <span class="label">Live Sample</span>
          <span class="preview-state" id="previewState">Standard</span>
        </div>
        <button id="cycleSampleBtn" class="cycle" type="button" title="Cycle sample sentence" aria-label="Cycle sample sentence">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2v6h-6"/>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M3 22v-6h6"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
          <span>Cycle</span>
        </button>
      </div>
      <p class="preview-sample" id="previewSample">
        <span class="wb">Foc</span>us <span class="wb">rea</span>der <span class="wb">gui</span>des <span class="wb">yo</span>ur <span class="wb">ey</span>es <span class="wb">smoo</span>thly <span class="wb">throu</span>gh <span class="wb">lon</span>g <span class="wb">arti</span>cles.
      </p>
    </section>

    <!-- Minimalist Footer -->
    <footer class="foot">
      <span class="synced">
        <span class="sync-dot"></span>
        <span>Local &amp; private</span>
      </span>
      <span class="foot-note">Instant cognitive anchoring</span>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
