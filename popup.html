<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Reader</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/logo-16.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Double-Bezel Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-bezel">
          <img src="icons/logo.png" alt="Focus Reader" class="logo-img">
        </div>
        <div class="brand-text">
          <div class="brand-title-row">
            <h1 class="brand-title">Focus Reader</h1>
            <span class="brand-version">v1.0</span>
          </div>
          <span class="brand-tagline">Bionic reading aid</span>
        </div>
      </div>
      <button id="settingsWheel" class="icon-btn" title="Extension preferences" aria-label="Open preferences">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>

    <!-- Context Host Capsule -->
    <section class="card host-card" id="hostCard">
      <div class="host-meta">
        <span class="host-dot" id="statusDot"></span>
        <div class="host-details">
          <span class="host-label">Active Target</span>
          <span class="host-name" id="hostName">Detecting…</span>
        </div>
      </div>
      <div class="host-actions">
        <span class="status-badge" id="hostBadge">Checking</span>
        <button id="resetHost" class="reset-chip" style="display: none;" type="button" title="Reset site to global default">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Reset</span>
        </button>
      </div>
    </section>

    <!-- Primary Tactile Activation Island -->
    <div class="action-wrap">
      <div id="spinner" class="spinner" role="status" aria-label="Loading status">
        <div class="spinner-ring"></div>
      </div>
      <button id="toggleButton" class="cta-island" style="display: none;" aria-pressed="false">
        <div class="cta-inner">
          <span class="cta-icon-capsule">
            <svg class="cta-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
              <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
          </span>
          <div class="cta-copy">
            <span class="cta-title" id="ctaText">Activate</span>
            <span class="cta-subtitle" id="ctaSub">Apply bionic reading to this tab</span>
          </div>
          <span class="cta-trailing-pill" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </span>
        </div>
      </button>
      <p class="page-note" id="pageNote" style="display: none;" role="status"></p>
    </div>

    <!-- Quick Intensity Dock -->
    <section class="card intensity-dock" aria-label="Quick intensity selector">
      <div class="dock-header">
        <span class="dock-label">Anchor Weight</span>
        <span class="dock-value" id="dockVal">Medium (700)</span>
      </div>
      <div class="dock-segmented" id="popupIntensityGroup" role="radiogroup" aria-label="Reading intensity">
        <button type="button" class="dock-seg-btn" data-intensity="light" role="radio" aria-checked="false">Light</button>
        <button type="button" class="dock-seg-btn is-active" data-intensity="medium" role="radio" aria-checked="true">Medium</button>
        <button type="button" class="dock-seg-btn" data-intensity="strong" role="radio" aria-checked="false">Strong</button>
      </div>
    </section>

    <!-- Live Reading Preview -->
    <section class="card preview-card">
      <div class="preview-header">
        <div class="preview-meta">
          <span class="preview-label">Live Preview</span>
          <span class="preview-state-label" id="previewState">Standard</span>
        </div>
        <button id="cycleSampleBtn" class="cycle-btn" type="button" title="Cycle sample sentence" aria-label="Cycle sample sentence">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2v6h-6"/>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M3 22v-6h6"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
          <span>Cycle</span>
        </button>
      </div>
      <p class="preview-sample" id="previewSample">
        <span class="wb">Foc</span>us <span class="wb">rea</span>der <span class="wb">gui</span>des <span class="wb">yo</span>ur <span class="wb">ey</span>es <span class="wb">smoo</span>thly <span class="wb">throu</span>gh <span class="wb">lon</span>g <span class="wb">arti</span>cles.
      </p>
    </section>

    <!-- Micro Footer -->
    <footer class="footer">
      <div class="footer-meta">
        <span class="footer-sync">
          <span class="sync-dot"></span> Synced
        </span>
        <span class="footer-text">Applies to this tab &amp; visits</span>
      </div>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
