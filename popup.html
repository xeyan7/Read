<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Reader</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/logo-16.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-red"></span>
    <span class="orb orb-violet"></span>
    <span class="orb orb-teal"></span>
  </div>

  <div class="shell">
    <header class="glass header">
      <div class="brand">
        <span class="logo-ring"><img src="icons/logo.png" alt="Focus Reader" class="logo-img"></span>
        <span class="brand-text">
          <span class="brand-row">
            <span class="brand-title">Focus Reader</span>
            <span class="brand-version">v1.0</span>
          </span>
          <span class="brand-tagline">Read faster, stay focused</span>
        </span>
      </div>
      <button id="settingsWheel" class="gear" title="Extension preferences" aria-label="Open preferences">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>

    <section class="glass site" id="hostCard" aria-label="Current site">
      <span class="host-dot" id="statusDot"></span>
      <span class="site-text">
        <span class="site-label">This site</span>
        <span class="site-name" id="hostName">Detecting…</span>
      </span>
      <span class="site-side">
        <span class="pill" id="hostBadge">Checking</span>
        <button id="resetHost" class="reset" style="display: none;" type="button" title="Reset site to global default">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Reset</span>
        </button>
      </span>
    </section>

    <div class="action-wrap">
      <div id="spinner" class="spinner" role="status" aria-label="Loading status">
        <div class="spinner-ring"></div>
      </div>
      <button id="toggleButton" class="activate" style="display: none;" aria-pressed="false">
        <span class="power">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </span>
        <span class="activate-text">
          <span class="activate-title" id="ctaText">Activate</span>
          <span class="activate-sub" id="ctaSub">Bionic reading for this tab</span>
        </span>
        <span class="arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
      <p class="page-note" id="pageNote" style="display: none;" role="status"></p>
    </div>

    <section class="glass weights" aria-label="Reading strength">
      <div class="row">
        <span class="label">Strength</span>
        <span class="value" id="dockVal">Medium (700)</span>
      </div>
      <div class="seg" id="popupIntensityGroup" role="radiogroup" aria-label="Reading intensity">
        <button type="button" class="dock-seg-btn" data-intensity="light" role="radio" aria-checked="false">Light</button>
        <button type="button" class="dock-seg-btn is-active" data-intensity="medium" role="radio" aria-checked="true">Medium</button>
        <button type="button" class="dock-seg-btn" data-intensity="strong" role="radio" aria-checked="false">Strong</button>
      </div>
    </section>

    <section class="glass preview">
      <div class="row">
        <span class="label">Preview · <span class="preview-state" id="previewState">Standard</span></span>
        <button id="cycleSampleBtn" class="cycle" type="button" title="Cycle sample sentence" aria-label="Cycle sample sentence">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2v6h-6"/>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M3 22v-6h6"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
          <span>Cycle</span>
        </button>
      </div>
      <p class="preview-sample" id="previewSample">
        <span class="wb">Foc</span>us <span class="wb">rea</span>der <span class="wb">gui</span>des <span class="wb">yo</span>ur <span class="wb">ey</span>es <span class="wb">smoo</span>thly <span class="wb">throu</span>gh <span class="wb">lon</span>g <span class="wb">arti</span>cles.
      </p>
    </section>

    <footer class="foot">
      <span class="synced"><span class="sync-dot"></span>Synced</span>
      <span class="foot-note">Applies to this tab &amp; visits</span>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
